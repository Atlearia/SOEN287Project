<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Admin - Create Course</title>
    <link rel="stylesheet" href="../css/admin-card-forms.css">
</head>

<body>
    <main class="pagewrappings1">
        <section class="cardbox1">
            <h1 class="title1">Create Course</h1>
            <hr class="line">

            <form class="form1" id="createCourseForm">
                <div class="formrow1">
                    <label for="courseCode">Course Code</label>
                    <input id="courseCode" type="text" placeholder="Ex: SOEN 287">
                </div>

                <div class="formrow1">
                    <label for="courseName">Course Name</label>
                    <input id="courseName" type="text" placeholder="">
                </div>

                <div class="formrow1">
                    <label for="InstructorName">Instructor</label>
                    <input id="InstructorName" type="text" placeholder="">
                </div>

                <div class="formrow1">
                    <label for="term">Term</label>
                    <select id="term">
                        <option>Winter 2026</option>
                        <option>Summer 2026</option>
                        <option>Fall 2027</option>
                        <option>Winter 2027</option>
                        <option>Summer 2028</option>
                        <option>Fall 2028</option>
                    </select>
                </div>

                <div class="formrowwide1">
                    <label for="desc">Description</label>
                    <textarea id="desc" placeholder="Course description..."></textarea>
                </div>

                <div class="buttonrow1">
                    <a href="admin-dashboard.html" class="backlink clickable-box">Cancel</a>
                    <button type="submit" class="backlink mainbutton clickable-box">Create Course</button>
                </div>
                <script> 
                    const form = document.getElementById("createCourseForm");

                    form.addEventListener("submit", function(event){
                        event.preventDefault(); // prevent page reload

                        // Get values from inputs
                        const courseCode = document.getElementById("courseCode").value;
                        const courseName = document.getElementById("courseName").value;
                        const instructor = document.getElementById("InstructorName").value;
                        const term = document.getElementById("term").value;
                        const description = document.getElementById("desc").value;
                        
                        alert("Course Created.");
                        const newCourse = {
                            courseCode,
                            courseName,
                            instructor,
                            term,
                            description,
                            assessments: [] // empty array for assessments will be added to later
                        };
                        //save data to back end
                        fetch("/add/courses", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(newCourse)
                        })
                        .then(response => response.json())
                        .then(data => {
                            console.log("Course saved:", data);
                            alert("Course Created.");
                            form.reset();
                        })
                        .catch(error => {
                            console.error("Error saving course:", error);
                        });

                        form.reset(); // clear the form
                    });
                    
                </script>
            </form>
        </section>
    </main>
</body>

</html>
