                <script> 
                    const form = document.getElementById("manageCourseForm");

                    form.addEventListener("submit", function(event){
                        event.preventDefault(); // prevent page reload

                        // Get values from inputs
                        const names = document.getElementsByName("assessmentName[]");
                        const weights = document.getElementsByName("assessmentPercent[]");
                        const assessments = [];
                        //put the info of the frm into an array
                        for (let i = 0; i < names.length; i++) {
                            assessments.push({
                                name: names[i].value,
                                weight: parseFloat(weights[i].value)
                            });
                        }
                        // get selected course
                        const courseCode = document.getElementById("selectedCourse").value;

                        //alert("Assesments Saved.");
                        
                        //save data to back end
                        fetch("/update/course/assessments", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({courseCode:courseCode,assessments: assessments})
                        })
                        .then(response => response.json())
                        .then(data => {
                            console.log("Assesment saved:", data);
                            alert("Assesment Saved.");
                            loadAssessmentsForCourse(courseCode);//reset the form
                        })
                        .catch(error => {
                            console.error("Error saving Assesments:", error);
                        });

                        loadAssessmentsForCourse(courseCode); // reset the form
                    });
                    
                </script>

    <script>
        async function loadCourses() {
        try {
            const response = await fetch("/get/courses");
            const data = await response.json();

            const courses = data.courses;

            const select = document.getElementById("selectedCourse");
            select.innerHTML = ""; // clear existing options

            courses.forEach(course => {
                const option = document.createElement("option");

                option.value = course.courseCode; //make a value the course code so that when sending to back end it knows which course to save to
                option.textContent = `${course.courseCode} - ${course.courseName}`;

                select.appendChild(option);
            });

        } catch (error) {
            console.error("Error loading courses:", error);
        }
    }
    loadCourses();
    </script>
    <script>
        async function loadAssessmentsForCourse(courseCode) {
        try {
            const response = await fetch("/get/courses");
            const data = await response.json();

            const course = data.courses.find(c => c.courseCode === courseCode);

            if (!course) return;

            //clear the current assesments in the ui
            assessments.length = 0;

            // copy backend assessments into an array
            course.assessments.forEach(a => assessments.push(a));

            // update UI to reflect backend data
            renderAssesment();

        } catch (error) {
            console.error("Error loading assessments:", error);
        }
    }
    </script>
