<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="preconnect" href="https://rsms.me/" />
        <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
        <link rel="stylesheet" href="../../css/dashboard/student-dashboard.css" />
        <title>My Settings</title>
    </head>
    <body>
    <section class="d-flex justify-content-center align-items-center min-vh-100">
        <div class="d-flex align-items-center gap-1 gap-md-5 shadow-lg rounded-4 p-5 flex-column flex-md-row">

            <div id="idProfile">
                <img src="../../assets/id-profile.png" alt="Profile Picture" id="idCard">
            </div>

            <div id="formSection" class="min-w-320">
                <h4 class="mb-4 fw-bold">My Settings</h4>
                <form>
                    <div class="form-row">
                        <div class="form-group mb-3">
                            <label for="inputName">Name</label>
                            <input
                            type="text"
                            class="form-control"
                            id="inputName"
                            placeholder="Name"
                            />
                        </div>
                        <div class="form-group mb-3">
                            <label for="inputEmail">Email</label>
                            <input
                            type="email"
                            class="form-control"
                            id="inputEmail"
                            placeholder="Email"
                            />
                        </div>
                        <div class="form-group mb-3">
                            <label for="inputPassword">Password</label>
                            <input
                            type="password"
                            class="form-control"
                            id="inputPassword"
                            placeholder="Password"
                            />
                        </div>
                    </div>
                    <button type="submit" class="btn btn-secondary my-2">
                        Update Profile
                    </button>
                </form>
            </div>
        </div>
    </section>

    <script src="../../scripts/student-dashboard.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
    ></script>
    </body>
</html>
