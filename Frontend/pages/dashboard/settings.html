<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="preconnect" href="https://rsms.me/" />
        <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
        <link rel="stylesheet" href="../../css/dashboard/student-dashboard.css" />
        <title>My Settings</title>
    </head>
    <body>

    <nav class="navbar d-flex flex-row justify-content-between px-3">
        <div>
            <img src="../../assets/concordia2.png" alt="Concordia Logo" id="dashboard-logo">
        </div>
        <div class="d-flex flex-row justify-content-between px-3">
            <div>
                <img src="../../assets/previous.png" alt="Back Button" id="setting-backbtn">
            </div>
            <div>
                <img id="darkModeIcon" src="../../assets/contrast.png" alt="Dark Mode" width="50" height="50" style="cursor:pointer;">
            </div>
        </div>
    </nav>

    <section class="d-flex justify-content-center align-items-center" id="form-section">
        <div class="d-flex align-items-center gap-1 gap-md-5 shadow-lg rounded-4 p-5 flex-column flex-md-row formContent">

            <div id="idProfile">
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    viewBox="0 0 24 24" 
                    width="250" 
                    height="250" 
                    fill="none"
                >
                    <!-- Head -->
                    <circle cx="12" cy="8" r="4" fill="currentColor"/>
                    <!-- Body -->
                    <path 
                        d="M4 20c0-4 4-6 8-6s8 2 8 6" 
                        fill="currentColor"
                    />
                </svg>
            </div>

            <div id="formSection">
                <h4 class="mb-4 fw-bold">My Settings</h4>

                <!-- ── Toggle buttons ──────────────────────────────────── -->
                <ul class="nav nav-pills mb-4" id="settingsTabs">
                    <li class="nav-item">
                        <button class="nav-link active" id="profileTab"
                            data-bs-toggle="pill"
                            data-bs-target="#profilePanel"
                            type="button">
                            Profile Info
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="passwordTab"
                            data-bs-toggle="pill"
                            data-bs-target="#passwordPanel"
                            type="button">
                            Change Password
                        </button>
                    </li>
                </ul>

                <!-- ── Tab content ─────────────────────────────────────── -->
                <div class="tab-content">

                    <!-- Profile Info panel -->
                    <div class="tab-pane fade show active" id="profilePanel">
                        <form id="updateProfileForm">
                            <div class="mb-3">
                                <label for="inputFirstName" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="inputFirstName" placeholder="First Name"/>
                            </div>
                            <div class="mb-3">
                                <label for="inputLastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="inputLastName" placeholder="Last Name"/>
                            </div>
                            <div class="mb-3">
                                <label for="inputEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="inputEmail" placeholder="Email"/>
                            </div>
                            <button type="submit" class="btn btn-secondary w-100 mt-2">
                                Update Profile
                            </button>
                        </form>
                    </div>

                    <!-- Change Password panel from bootstrap components -->
                    <div class="tab-pane fade" id="passwordPanel">
                        <form id="changePasswordForm">
                            <div class="mb-3">
                                <label for="currentPassword" class="form-label">Current password</label>
                                <input type="password" class="form-control" id="currentPassword" placeholder="Current password"/>
                            </div>
                            <div class="mb-3">
                                <label for="newPassword" class="form-label">New password</label>
                                <input type="password" class="form-control" id="newPassword" placeholder="New password"/>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm new password</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password"/>
                                <div id="passwordMatchError" class="text-danger mt-1 small" style="display:none;">
                                    Passwords do not match.
                                </div>
                            </div>
                            <button type="submit" class="btn btn-secondary w-100 mt-2">
                                Save new password
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </section>

  }
  window.addEventListener('load', addDarkmodeWidget);
</script> -->

    <script src="../../scripts/settings.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
    ></script>
    </body>
</html>
