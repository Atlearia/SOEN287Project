<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <title>Reset Password</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<style>
            body{
                margin:0;
                overflow:hidden; /*/ make it so we cant scroll on page/*/
                height:100%;
                background-color: #3E4B63;
            }

            .ResetPage{
                height: 100vh;
            }
            
            .ResetBox{
                background-color: #F2F4F7;
                height:50vh;
                
            }
        </style>
            

 <div class="container">

          
            <div class="row ResetPage justify-content-center  align-items-center">
                <!-- Login box -->
                 
                <div class="col-sm-5  "><div class="p-3  ResetBox rounded">
                    <h4 class="card-title mb-1">Forgot your Password?</h4>
                    <p class="text-muted mb-4">Enter your email.</p>
                    <form id="forgotForm">

                     <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="you@example.com" required />
                    </div>

                    
                    <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
                    <p id="message" class="text-center mt-3 text-success"></p>
                    </form>
                    <p class="text-center mt-3 mb-0">
                    <a href="../Authentication/SignIn.html" class="text-decoration-none justi">Back to login</a>
                    </p>

                </div>
                </div>
            </div>
</div>
        

<script src="../passwordReset/forgot-password.js" ></script>
       
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
   

</body>

</html>
